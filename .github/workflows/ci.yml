name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: extractions/setup-just@v4
      - run: just check test
